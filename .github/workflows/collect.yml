name: Collect – SwiftIOC

on:
  workflow_dispatch:
    inputs:
      window_hours:
        description: "Lookback hours"
        required: false
        default: "48"
      urlhaus_status:
        description: "Filter URLhaus by status (any|online|offline)"
        required: false
        default: "online"

  schedule:
    - cron: "0 */4 * * *"

# Intentionally no `pull_request` trigger: this job runs the full collector
# against every production feed (with --fail-on-empty guards) and auto-commits
# + deploys on success. Running it on every PR push would hit live external
# services on each commit and could fail PR checks for reasons unrelated to
# the diff (e.g. a feed transiently returning zero indicators). ci.yml already
# exercises the collector end-to-end via a scoped dry run for PR validation.

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect-swiftioc-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.11"
  OUT_DIR: "public"
  DIAG_DIR: "public/diagnostics"
  IOC_DIR: "public/iocs"
  CHANGELOG_DIR: "public/changelog"
  RAW_DIR: "public/diagnostics/raw"
  SOURCES_FILE: "sources.yml"

jobs:
  collect:
    name: Collect IOC feeds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Ensure runtime directories
        shell: bash
        run: |
          mkdir -p "$DIAG_DIR" "$RAW_DIR" "$IOC_DIR" "$CHANGELOG_DIR"

          if [ ! -f "$SOURCES_FILE" ] && [ -f "sources.example.yml" ]; then
            cp sources.example.yml "$SOURCES_FILE"
            echo "Copied sources.example.yml -> $SOURCES_FILE"
          fi

      - name: Validate required files
        shell: bash
        run: |
          test -f swiftioc.py || { echo "swiftioc.py not found"; exit 1; }
          test -f requirements.txt || { echo "requirements.txt not found"; exit 1; }
          test -f "$SOURCES_FILE" || { echo "$SOURCES_FILE not found"; exit 1; }

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 -r requirements.txt

      - name: Run self-test
        shell: bash
        run: |
          python swiftioc.py --self-test

      - name: Show collector settings
        shell: bash
        env:
          WINDOW_HOURS: ${{ github.event.inputs.window_hours || '48' }}
          URLHAUS_STATUS: ${{ github.event.inputs.urlhaus_status || 'online' }}
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "WINDOW_HOURS=$WINDOW_HOURS"
          echo "URLHAUS_STATUS=$URLHAUS_STATUS"
          echo "OUT_DIR=$OUT_DIR"
          echo "SOURCES_FILE=$SOURCES_FILE"

      - name: Run collector
        id: collector
        shell: bash
        env:
          WINDOW_HOURS: ${{ github.event.inputs.window_hours || '48' }}
          URLHAUS_STATUS: ${{ github.event.inputs.urlhaus_status || 'online' }}
        run: |
          set -Eeuo pipefail

          # --persist-feed makes this a living feed: the latest.jsonl committed
          # by the previous run (checked out above) is merged in, re-observed
          # indicators refresh, and stale ones decay until they expire.
          # Retention keeps the published feed curated ("top IOCs", KEVIntel
          # style): drop anything not seen in 30 days, then keep the top 10k by
          # score/recency so the committed feed stays high-signal and small.
          python swiftioc.py -vv \
            --out-dir "$OUT_DIR" \
            --sources "$SOURCES_FILE" \
            --window-hours "$WINDOW_HOURS" \
            --urlhaus-status "$URLHAUS_STATUS" \
            --persist-feed \
            --max-age-days 30 \
            --max-store 10000 \
            --log-file "$DIAG_DIR/run.log" \
            --log-format json \
            --log-file-level DEBUG \
            --save-raw-dir "$RAW_DIR" \
            --diag-json "$DIAG_DIR/run.json" \
            --report "$DIAG_DIR/REPORT.md" \
            --fail-on-empty urlhaus_recent_urls malwarebazaar_recent

      - name: Summarize IOC outputs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -f "scripts/summarize_iocs.py" ] && [ -f "$DIAG_DIR/run.json" ] && [ -f "$IOC_DIR/latest.jsonl" ]; then
            python scripts/summarize_iocs.py \
              --diag "$DIAG_DIR/run.json" \
              --ioc-jsonl "$IOC_DIR/latest.jsonl" \
              --out "$DIAG_DIR/summary.md" \
              --index "$OUT_DIR/index.md"
          else
            echo "Skipping summarize_iocs.py because one or more inputs are missing."
          fi

      - name: Show failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "Workflow failed. Showing recent diagnostics..."
          [ -f "$DIAG_DIR/run.log" ] && tail -n 200 "$DIAG_DIR/run.log" || true
          [ -f "$DIAG_DIR/REPORT.md" ] && tail -n 200 "$DIAG_DIR/REPORT.md" || true
          [ -f "$DIAG_DIR/summary.md" ] && tail -n 200 "$DIAG_DIR/summary.md" || true

      - name: Upload diagnostics and outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swiftioc-artifacts-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            public/diagnostics/**
            public/iocs/**
            public/changelog/**
            public/index.md

      - name: Upload built public site
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: swiftioc-public-site
          retention-days: 3
          if-no-files-found: error
          path: public/**

      - name: Auto-commit updated outputs
        if: success() && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(ioc): update feeds [skip ci]"
          # Commit only the compact, human-facing artefacts. The bulky derived
          # formats (latest.json, latest.tsv, stix2.json) are regenerated every
          # run and published via GitHub Pages + workflow artifacts, so keeping
          # them out of git history avoids multi-MB churn on every collection.
          file_pattern: |
            public/iocs/latest.csv
            public/iocs/latest.jsonl
            public/iocs/high_confidence.csv
            public/iocs/high_confidence.jsonl
            public/changelog/**
            public/diagnostics/**
            public/index.md
          commit_user_name: SwiftIOC Bot
          commit_user_email: actions@github.com
          skip_dirty_check: false
          skip_fetch: false

  deploy-pages:
    name: Deploy GitHub Pages
    needs: collect
    if: github.ref == 'refs/heads/main' && vars.ENABLE_PAGES != 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Download built public site
        uses: actions/download-artifact@v8
        with:
          name: swiftioc-public-site
          path: ./public

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
