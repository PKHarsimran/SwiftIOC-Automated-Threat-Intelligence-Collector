name: Collect – SwiftIOC

on:
  workflow_dispatch:
    inputs:
      window_hours:
        description: "Lookback hours"
        required: false
        default: "48"
      urlhaus_status:
        description: "Filter URLhaus by status (any|online|offline)"
        required: false
        default: "online"

  schedule:
    - cron: "0 */4 * * *"

  pull_request:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect-swiftioc-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  OUT_DIR: "public"
  DIAG_DIR: "public/diagnostics"
  IOC_DIR: "public/iocs"
  CHANGELOG_DIR: "public/changelog"
  RAW_DIR: "public/diagnostics/raw"
  SOURCES_FILE: "sources.yml"

jobs:
  collect:
    name: Collect IOC feeds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Ensure runtime directories
        shell: bash
        run: |
          mkdir -p "$DIAG_DIR" "$RAW_DIR" "$IOC_DIR" "$CHANGELOG_DIR"

          if [ ! -f "$SOURCES_FILE" ] && [ -f "sources.example.yml" ]; then
            cp sources.example.yml "$SOURCES_FILE"
            echo "Copied sources.example.yml -> $SOURCES_FILE"
          fi

      - name: Validate required files
        shell: bash
        run: |
          test -f swiftioc.py || { echo "swiftioc.py not found"; exit 1; }
          test -f requirements.txt || { echo "requirements.txt not found"; exit 1; }
          test -f "$SOURCES_FILE" || { echo "$SOURCES_FILE not found"; exit 1; }

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 -r requirements.txt

      - name: Run self-test
        shell: bash
        run: |
          python swiftioc.py --self-test

      - name: Show collector settings
        shell: bash
        env:
          WINDOW_HOURS: ${{ github.event.inputs.window_hours || '48' }}
          URLHAUS_STATUS: ${{ github.event.inputs.urlhaus_status || 'online' }}
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "WINDOW_HOURS=$WINDOW_HOURS"
          echo "URLHAUS_STATUS=$URLHAUS_STATUS"
          echo "OUT_DIR=$OUT_DIR"
          echo "SOURCES_FILE=$SOURCES_FILE"

      - name: Run collector
        id: collector
        shell: bash
        env:
          WINDOW_HOURS: ${{ github.event.inputs.window_hours || '48' }}
          URLHAUS_STATUS: ${{ github.event.inputs.urlhaus_status || 'online' }}
        run: |
          set -Eeuo pipefail

          python swiftioc.py -vv \
            --out-dir "$OUT_DIR" \
            --sources "$SOURCES_FILE" \
            --window-hours "$WINDOW_HOURS" \
            --urlhaus-status "$URLHAUS_STATUS" \
            --log-file "$DIAG_DIR/run.log" \
            --log-format json \
            --log-file-level DEBUG \
            --save-raw-dir "$RAW_DIR" \
            --diag-json "$DIAG_DIR/run.json" \
            --report "$DIAG_DIR/REPORT.md" \
            --fail-on-empty urlhaus_recent_urls malwarebazaar_recent

      - name: Summarize IOC outputs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -f "scripts/summarize_iocs.py" ] && [ -f "$DIAG_DIR/run.json" ] && [ -f "$IOC_DIR/latest.jsonl" ]; then
            python scripts/summarize_iocs.py \
              --diag "$DIAG_DIR/run.json" \
              --ioc-jsonl "$IOC_DIR/latest.jsonl" \
              --out "$DIAG_DIR/summary.md" \
              --index "$OUT_DIR/index.md"
          else
            echo "Skipping summarize_iocs.py because one or more inputs are missing."
          fi

      - name: Show failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "Workflow failed. Showing recent diagnostics..."
          [ -f "$DIAG_DIR/run.log" ] && tail -n 200 "$DIAG_DIR/run.log" || true
          [ -f "$DIAG_DIR/REPORT.md" ] && tail -n 200 "$DIAG_DIR/REPORT.md" || true
          [ -f "$DIAG_DIR/summary.md" ] && tail -n 200 "$DIAG_DIR/summary.md" || true

      - name: Upload diagnostics and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftioc-artifacts-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            public/diagnostics/**
            public/iocs/**
            public/changelog/**
            public/index.md

      - name: Upload built public site
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: swiftioc-public-site
          retention-days: 3
          if-no-files-found: error
          path: public/**

      - name: Auto-commit updated outputs
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ioc): update feeds [skip ci]"
          file_pattern: |
            public/iocs/**
            public/changelog/**
            public/diagnostics/**
            public/index.md
          commit_user_name: SwiftIOC Bot
          commit_user_email: actions@github.com
          skip_dirty_check: false
          skip_fetch: false

  deploy-pages:
    name: Deploy GitHub Pages
    needs: collect
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_PAGES != 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Download built public site
        uses: actions/download-artifact@v4
        with:
          name: swiftioc-public-site
          path: ./public

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
