name: CI – SwiftIOC

on:
  push:
    branches: [main]
    paths:
      - "swiftioc.py"
      - "sources*.yml"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.11"

permissions:
  contents: read

concurrency:
  group: ci-swiftioc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, audit, and self-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dependency audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt

      - name: Install lint and type-check tools
        shell: bash
        run: |
          set -Eeuo pipefail
          pip install ruff pyright

      - name: Ruff lint
        run: ruff check .

      - name: Pyright type check
        run: pyright

      - name: Self-test
        run: python swiftioc.py --self-test

      - name: Dry run (skip RSS, short window)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p public/diagnostics/raw
          python swiftioc.py -v \
            --out-dir public \
            --sources sources.example.yml \
            --window-hours 6 \
            --skip-rss \
            --log-file public/diagnostics/run.log \
            --log-format json \
            --log-file-level DEBUG \
            --save-raw-dir public/diagnostics/raw \
            --diag-json public/diagnostics/run.json \
            --report public/diagnostics/REPORT.md

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          retention-days: 7
          if-no-files-found: warn
          path: |
            public/diagnostics/**
            public/iocs/**
