name: Maintenance - SwiftIOC

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  issues: write

concurrency:
  group: maintenance-swiftioc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-indicator-watch:
    name: Zero indicator watch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check recent changelog totals
        id: zero_check
        shell: bash
        run: |
          python <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("public/changelog/CHANGELOG.md")
          totals = []

          if path.exists():
              text = path.read_text(encoding="utf-8", errors="ignore")
              totals = [int(m.group(1)) for m in re.finditer(r"Total indicators:\s+\*\*(\d+)\*\*", text)]
              totals = totals[-3:]

          needs_issue = len(totals) == 3 and all(t == 0 for t in totals)
          has_enough_history = len(totals) == 3
          totals_text = "/".join(str(t) for t in totals) if totals else "none"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"needs_issue={'true' if needs_issue else 'false'}\n")
              fh.write(f"has_enough_history={'true' if has_enough_history else 'false'}\n")
              fh.write(f"totals={totals_text}\n")

          print(f"Latest totals: {totals_text}")
          PY

      - name: Open or close zero-indicator alert issue
        if: steps.zero_check.outputs.has_enough_history == 'true'
        uses: actions/github-script@v9
        env:
          NEEDS_ISSUE: ${{ steps.zero_check.outputs.needs_issue }}
          TOTALS: ${{ steps.zero_check.outputs.totals }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = "Alert: SwiftIOC collected zero indicators in the last 3 runs";
            const totals = process.env.TOTALS;
            const needsIssue = process.env.NEEDS_ISSUE === "true";
            const { owner, repo } = context.repo;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
              creator: "github-actions[bot]"
            });

            const existing = issues.find(issue => issue.title === title);

            if (needsIssue) {
              if (existing) {
                core.info("Alert issue already open");
                return;
              }

              await github.rest.issues.create({
                owner,
                repo,
                title,
                body:
                  "The last three changelog entries recorded zero indicators.\n\n" +
                  `Totals: ${totals}\n\n` +
                  "Please review recent collector runs, source availability, and parser behavior."
              });

              core.info("Created alert issue");
              return;
            }

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Recovery detected. Recent totals are now: ${totals}`
              });

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: "closed"
              });

              core.info("Closed alert issue after recovery");
              return;
            }

            core.info("No alert issue needed");
            
  artifact-uptime-check:
    name: Artifact uptime check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify recent artifact commits
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d public/iocs ]; then
            echo "No public/iocs directory; skipping check."
            exit 0
          fi

          last_commit="$(git log -1 --format=%ct -- public/iocs || true)"
          if [ -z "$last_commit" ]; then
            echo "No commits found for public/iocs; skipping."
            exit 0
          fi

          now="$(date +%s)"
          age_hours="$(( (now - last_commit) / 3600 ))"

          echo "Hours since last artifact commit: ${age_hours}"

          if [ "$age_hours" -gt 12 ]; then
            echo "::error::No updates to public/iocs in the last 12 hours"
            exit 1
          fi
