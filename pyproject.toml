[project]
name = "swiftioc"
version = "0.2.0"
description = "Open-source automated threat intelligence collector"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
# Mirror ruff's default rule set (E4/E7/E9 + F) so this config documents the
# existing CI behaviour without introducing a large stylistic churn.
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["swiftioc.py", "scripts", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
